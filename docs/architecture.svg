<title id="title">Stock News Calendar: system architecture</title><desc id="desc">GitHub Pages serves a Vite vanilla JavaScript frontend. Cloudflare Pages or Workers API connects to D1, Google OAuth and public sources. GitHub Actions collects data through authenticated API routes. Optional AI runs in the browser, local Python or Actions.</desc>
